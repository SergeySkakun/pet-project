pre-commit:
  parallel: true
  commands:
    biome-check:
      glob: "*.{html,js,ts,jsx,tsx,json,jsonc}"
      run: npx @biomejs/biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true
    ts-check:
      glob: "*.{ts,tsx}"
      run: npx tsc --noEmit
    fast-tests:
      run: npx vitest related {staged_files} --run --passWithNoTests --browser.headless

pre-push:
  commands:
    browser-tests:
      run: npm run test
